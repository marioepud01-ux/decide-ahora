<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google-site-verification" content="qdY0_OeBwpiS1LizoXTAFFUqv2qr2YkxKxW3_P0T0Vc" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3771367851632169"
     crossorigin="anonymous"></script>
<title>Decide Ahora</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181c;--muted:#6d7078;--line:#e5e7eb;--accent:#111827;--good:#e8f7ee;--goodt:#17633a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 60px}.brand{font-weight:800;font-size:15px;letter-spacing:-.2px;margin-bottom:30px}
h1{font-size:38px;line-height:1.05;margin:0 0 10px;letter-spacing:-1.5px}.sub{color:var(--muted);font-size:16px;margin-bottom:25px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
label{display:block;font-weight:700;font-size:14px;margin:17px 0 8px}textarea,input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font:inherit;outline:none;background:#fff}textarea{min-height:105px;resize:vertical}input:focus,textarea:focus{border-color:#9ca3af}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:999px;cursor:pointer;font-weight:600}.choice button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.primary{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.result{display:none;margin-top:16px}.answer{font-size:27px;font-weight:850;line-height:1.15;margin-bottom:8px}.reason{color:#4f535c;line-height:1.5}.steps{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.steps b{display:block;margin-bottom:8px}.step{padding:8px 0;color:#444}
.small{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}.history{margin-top:22px}.history h2{font-size:16px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;font-size:14px}.empty{color:var(--muted);font-size:14px}
@media(max-width:560px){h1{font-size:32px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="brand">DECIDE AHORA</div>
<h1>Deja de darle vueltas.</h1>
<div class="sub">Dime una decisión concreta. Te devuelve una acción concreta.</div>
<section class="card">
<label>¿Qué estás intentando decidir?</label>
<textarea id="decision" placeholder="Ej.: ¿Me compro el coche o sigo con el que tengo?"></textarea>
<div class="row"><div><label>¿Qué pesa más?</label><div class="choice" id="priority"><button data-v="dinero">Dinero</button><button data-v="tiempo">Tiempo</button><button data-v="tranquilidad">Tranquilidad</button><button data-v="crecer">Crecer</button></div></div>
<div><label>¿Qué tan reversible es?</label><div class="choice" id="risk"><button data-v="facil">Fácil</button><button data-v="medio">Medio</button><button data-v="dificil">Difícil</button></div></div></div>
<label>Opciones (una por línea)</label>
<textarea id="options" placeholder="Opción A&#10;Opción B&#10;Opción C"></textarea>
<button class="primary" onclick="decide()">Decidir</button>
<div class="result" id="result"><div class="answer" id="answer"></div><div class="reason" id="reason"></div><div class="steps"><b>Haz esto ahora</b><div id="steps"></div></div></div>
</section>
<div class="small">No intenta adivinar tu vida. Reduce la decisión a coste, beneficio, reversibilidad y siguiente paso.</div>
<section class="history"><h2>Últimas decisiones</h2><div id="history"></div></section>
</main>
<script>
const state={priority:"",risk:""};
document.querySelectorAll(".choice").forEach(group=>{group.querySelectorAll("button").forEach(b=>b.onclick=()=>{group.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");state[group.id]=b.dataset.v;});});
function decide(){const d=document.getElementById("decision").value.trim();const opts=document.getElementById("options").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!d||opts.length<2){alert("Escribe una decisión y al menos 2 opciones.");return}let p=state.priority||"tranquilidad",r=state.risk||"medio";let scores=opts.map((o,i)=>{let s=50;const t=o.toLowerCase();if(p==="dinero"&&/(barat|ahorr|menos|gratis|ingreso|rentab)/.test(t))s+=15;if(p==="tiempo"&&/(rápid|rapido|fácil|facil|ahora|cerca|simple)/.test(t))s+=15;if(p==="tranquilidad"&&/(segur|estable|conoc|mantener|tranquil)/.test(t))s+=15;if(p==="crecer"&&/(aprend|crec|exper|nuevo|probar|negocio)/.test(t))s+=15;if(r==="facil"&&/(probar|test|ensay|temporal)/.test(t))s+=10;if(r==="dificil"&&/(segur|conoc|mantener)/.test(t))s+=10;s-=i*.5;return s});const max=Math.max(...scores),idx=scores.indexOf(max),winner=opts[idx];document.getElementById("answer").textContent="Yo haría: "+winner;document.getElementById("reason").textContent=`La decisión favorece “${winner}” porque encaja mejor con tu prioridad (${p}) y con un nivel de reversibilidad ${r}. Si dos opciones siguen muy igualadas, la mejor prueba es convertir una en un experimento pequeño.`;document.getElementById("steps").innerHTML=`<div class="step">1. Define el primer paso de 15 minutos para “${winner}”.</div><div class="step">2. Hazlo hoy sin comprometerte más de lo necesario.</div><div class="step">3. Revisa el resultado antes de tomar una decisión mayor.</div>`;document.getElementById("result").style.display="block";const h=JSON.parse(localStorage.getItem("decideHistory")||"[]");h.unshift({d,winner,date:new Date().toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"})});localStorage.setItem("decideHistory",JSON.stringify(h.slice(0,8)));renderHistory();}
function renderHistory(){const h=JSON.parse(localStorage.getItem("decideHistory")||"[]");document.getElementById("history").innerHTML=h.length?h.map(x=>`<div class="item"><b>${esc(x.d)}</b><br>→ ${esc(x.winner)} <span style="color:#888">· ${x.date}</span></div>`).join(""):'<div class="empty">Aquí aparecerán tus decisiones.</div>';}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
renderHistory();
</script>
</body></html>
